version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: my-mysql-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: backend-container_name
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD= ${DB_PASSWORD}
      - DB_NAME= ${DB_NAME}
      - PORT=5000
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: frontend-container
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  db_data:
